<div class="modal-backdrop">
  <div class="modal-box" [class.shrinks-height]="currentPage() === 1">
    <div class="modal-content no-scrollbar">
      @if (currentPage() === 1) {
        <div class="level-change-button-row">
          <button class="btn-primary" type="button" (click)="subirNivel()">Subir Nível</button>
          @if (character().level > 1) {
            <button
              class="btn-tertiary"
              type="button"
              [disabled]="reduzirNivelConfirming() && !reduzirNivelReady()"
              (click)="reduzirNivel()"
            >
              {{ reduzirNivelConfirming() ? 'Confirmar' : 'Reduzir Nível' }}
            </button>
          }
        </div>
      }
      @if (currentPage() === 2) {
        <app-class-pick-row
          [classes]="classItems()"
          [label]="'Level ' + nextLevel()"
          [isFirstArcanistaLevel]="isArcanistaFirstLevel()"
          [classId]="selectedClassId()"
          (classIdChange)="setSelectedClassId($event)"
          [(arcanistaPathPowerId)]="arcanistaPathPowerId"
        />
        @if (selectedClassId() !== null && offersPowerPick()) {
          <div class="poder-dropdown-wrap">
            <app-searchable-dropdown labelText="Poder" [items]="availablePowerItems()" [(value)]="selectedPowerId" />
            @if (powerPickHint(); as hint) {
              <p class="h3-subtitle hint">{{ hint }}</p>
            }
          </div>
        }
        @for (slot of newSpellSlots(); track $index) {
          <div class="magia-dropdown-wrap">
            <app-searchable-dropdown
              [labelText]="spellSlotLabel(slot.cap)"
              [items]="spellOptionsForSlot($index)"
              [value]="chosenSpellIdAt($index)"
              (valueChange)="setChosenSpellIdAt($index, $event)"
              [openUpwards]="$index >= 2"
            />
          </div>
        }
      }
    </div>
    <div class="button-row">
      <button class="btn-secondary" type="button" (click)="handleCancel()">{{ currentPage() === 2 ? 'Voltar' : 'Cancelar' }}</button>
      @if (currentPage() === 2) {
        <button
          class="btn-primary"
          type="button"
          [disabled]="
            selectedClassId() === null ||
            (offersPowerPick() && selectedPowerId() === null) ||
            (isArcanistaFirstLevel() && arcanistaPathPowerId() === null) ||
            !spellPicksComplete()
          "
          (click)="selecionarNivel()"
        >
          Selecionar
        </button>
      }
    </div>
  </div>
</div>
