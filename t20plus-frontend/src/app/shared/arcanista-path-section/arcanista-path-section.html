<div class="arcanista-path-section" [class.without-linhagem]="!isSelected(feiticeiroId)">
  <app-checkbox labelText="Bruxo" [value]="isSelected(bruxoId)" (valueChange)="toggle(bruxoId, $event)" />
  <app-checkbox labelText="Feiticeiro" [value]="isSelected(feiticeiroId)" (valueChange)="toggle(feiticeiroId, $event)" />
  <app-checkbox labelText="Mago" [value]="isSelected(magoId)" (valueChange)="toggle(magoId, $event)" />
  @if (isSelected(feiticeiroId)) {
    <app-power-pick-row label="Linhagem" [items]="linhagemItems()" [(powerId)]="linhagemPowerId" />
  }
</div>
