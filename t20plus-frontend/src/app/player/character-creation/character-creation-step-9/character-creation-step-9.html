<div class="page-wrap">
  <div class="card-frame">
    <app-card-header title="Níveis e Poderes" />
    <div class="card character-creation-step-9-card no-scrollbar">
      <div class="card-body">
        <div class="scrollable-content no-scrollbar">
        @if (draftGeneralComplicationId() !== null) {
          <div class="form-fields general-complication-power-fields">
            <app-searchable-dropdown
              class="compact-dropdown"
              labelText="Poder Geral (Complicação)"
              [items]="generalPowerItems()"
              [(value)]="draftGeneralComplicationPowerId"
            />
          </div>
        }
        @if (draftAgeBracket() === 'adulto') {
          <div class="form-fields adulto-power-fields">
            <app-searchable-dropdown
              class="compact-dropdown"
              labelText="Poder Geral (Adulto)"
              [items]="adultoPowerItems()"
              [(value)]="draftAdultoPowerId"
            />
          </div>
        }
        @if (draftRaceId() === 22) {
          <div class="form-fields ambicao-herdada-power-fields">
            <app-searchable-dropdown
              class="compact-dropdown"
              labelText="Ambição Herdada"
              [items]="ambicaoHerdadaPowerItems()"
              [(value)]="draftAmbicaoHerdadaPowerId"
            />
          </div>
        }
        <div class="form-fields">
          @for (row of levelPowerRows(); track row.index) {
            <app-searchable-dropdown
              class="compact-dropdown"
              [labelText]="levelLabel(row)"
              [items]="availablePowerItems(row)"
              [value]="classPowerIdAt(row.index)"
              (valueChange)="setClassPowerIdAt(row.index, $event)"
              [openUpwards]="row.index >= 4"
            />
            @if (powerPickHint(row.index); as hint) {
              <p class="h3-subtitle hint">{{ hint }}</p>
            }
          }
        </div>
        </div>
        <div class="button-row">
          <button class="btn-secondary" type="button" (click)="back()">Voltar</button>
          <button class="btn-primary" type="button" [disabled]="!canContinue()" (click)="continue()">{{ hasCasterClass() ? 'Próximo' : 'Salvar' }}</button>
        </div>
      </div>
    </div>
  </div>
</div>

<app-character-creation-saving />
