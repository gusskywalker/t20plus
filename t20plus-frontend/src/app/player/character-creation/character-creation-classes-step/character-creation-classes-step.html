<div class="page-wrap">
  <div class="card-frame">
    <app-card-header title="Classes" />
    <div class="card character-creation-classes-step-card no-scrollbar">
      <div class="card-body">
        <div class="form-fields no-scrollbar">
          @for (row of rows(); track row.absoluteIndex) {
            <app-searchable-dropdown
              [labelText]="row.label"
              [items]="classes"
              [value]="classIdAt(row.absoluteIndex)"
              (valueChange)="setClassIdAt(row.absoluteIndex, $event)"
              [openUpwards]="row.absoluteIndex >= 4"
            />
            @if (isFirstArcanistaRow(row.absoluteIndex)) {
              <app-arcanista-path-section [(selectedPowerId)]="draftArcanistaPathPowerId" />
            }
          }
        </div>
        <div class="button-row">
          <button class="btn-secondary" type="button" (click)="back()">Voltar</button>
          <button class="btn-primary" type="button" [disabled]="!canContinue()" (click)="continue()">Continuar</button>
        </div>
      </div>
    </div>
  </div>
</div>
