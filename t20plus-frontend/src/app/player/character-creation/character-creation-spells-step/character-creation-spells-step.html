<div class="page-wrap">
  <div class="card-frame">
    <app-card-header title="Magias" />
    <div class="card character-creation-spells-step-card no-scrollbar">
      <div class="card-body">
        <div class="form-fields no-scrollbar">
          @for (row of limitedSpellChoiceRows(); track row.power.id) {
            @for (slot of row.slots; track slot.index) {
              <app-searchable-dropdown
                class="compact-dropdown"
                [labelText]="row.label"
                [items]="slot.items"
                [value]="slot.pick"
                (valueChange)="setLimitedSpellChoice(row.power.id, slot.index, $event)"
              />
            }
          }
          @if (hasTatuagemMistica()) {
            <app-tatuagem-mistica-section [(spellId)]="draftTatuagemMisticaSpellId" [excludedSpellIds]="excludedForTatuagemMistica()" />
          }
          @if (hasCancaoDosMares()) {
            <app-cancao-dos-mares-section [(spellIds)]="draftCancaoDosMaresSpellIds" [excludedSpellIds]="excludedForCancaoDosMares()" />
          }
          @if (hasMagiaDasFadas()) {
            <app-magia-das-fadas-section [(spellIds)]="draftMagiaDasFadasSpellIds" [excludedSpellIds]="excludedForMagiaDasFadas()" />
          }
          @for (slot of slots(); track $index) {
            <app-searchable-dropdown
              class="compact-dropdown"
              [labelText]="slotLabel(slot)"
              [items]="optionsForSlot($index)"
              [value]="chosenSpellIdAt($index)"
              (valueChange)="setChosenSpellIdAt($index, $event)"
            />
          }
        </div>
        <div class="button-row">
          <button class="btn-secondary" type="button" (click)="back()">Voltar</button>
          <button class="btn-primary" type="button" [disabled]="!canContinue()" (click)="continue()">Salvar</button>
        </div>
      </div>
    </div>
  </div>
</div>

<app-character-creation-saving />
