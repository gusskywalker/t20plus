<div class="page-wrap">
  <div class="card-frame">
    <app-card-header title="Magias" />
    <div class="card character-creation-spells-step-card no-scrollbar">
      <div class="card-body">
        <div class="form-fields no-scrollbar">
          @if (hasTatuagemMistica()) {
            <app-tatuagem-mistica-section [(spellId)]="draftTatuagemMisticaSpellId" />
          }
          @if (hasCancaoDosMares()) {
            <app-cancao-dos-mares-section [(spellIds)]="draftCancaoDosMaresSpellIds" />
          }
          @if (hasMagiaDasFadas()) {
            <app-magia-das-fadas-section [(spellIds)]="draftMagiaDasFadasSpellIds" />
          }
          @for (slot of slots(); track $index) {
            <app-searchable-dropdown
              class="compact-dropdown"
              [labelText]="slotLabel(slot.cap)"
              [items]="optionsForSlot($index)"
              [value]="chosenSpellIdAt($index)"
              (valueChange)="setChosenSpellIdAt($index, $event)"
            />
          }
        </div>
        <div class="button-row">
          <button class="btn-secondary" type="button" (click)="back()">Voltar</button>
          <button class="btn-primary" type="button" [disabled]="!canContinue()" (click)="continue()">Salvar</button>
        </div>
      </div>
    </div>
  </div>
</div>

<app-character-creation-saving />
