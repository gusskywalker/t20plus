<div class="page-wrap">
  <div class="card-frame">
    <app-card-header [title]="title()" [hideHome]="true" />
    <div class="card mode-selector-card no-scrollbar">
      <div class="mode-buttons">
        <div class="mode-option inner-card">
          <img class="mode-icon" src="/images/warriorgiflightblack.gif" alt="" />
          <button class="btn-primary" type="button" (click)="chooseJogador()">Jogador</button>
        </div>
        <div class="mode-option inner-card">
          <img class="mode-icon master-icon" src="/images/mastergiftransparent.gif" alt="" />
          <button class="btn-primary" type="button" (click)="chooseMestre()">Mestre</button>
        </div>
      </div>
    </div>
  </div>
</div>
