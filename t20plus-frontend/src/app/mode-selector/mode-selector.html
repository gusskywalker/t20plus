<div class="page-wrap">
  <div class="card-frame">
    <app-card-header [title]="title()" [hideHome]="true" />
    <div class="card mode-selector-card">
      <div class="mode-buttons">
        <div class="mode-option">
          <img class="mode-icon" src="/images/tormenta-player-icon.png" alt="" />
          <button class="btn-primary" type="button" (click)="chooseJogador()">Jogador</button>
        </div>
        <app-tormenta-divider />
        <div class="mode-option">
          <img class="mode-icon" src="/images/tormenta-master-icon.png" alt="" />
          <button class="btn-primary" type="button" (click)="chooseMestre()">Mestre</button>
        </div>
      </div>
    </div>
  </div>
</div>
